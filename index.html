<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STORY of FANTASY GUILD</title>

  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #111;
      color: #fff;
      font-family: sans-serif;
      text-align: center;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 14px;
      color: #ccc;
      margin-bottom: 30px;
    }

    .stamp {
      display: none;
      padding: 25px;
      border: 2px solid #b58cff;
      border-radius: 20px;
      background: #1c1628;
      margin-bottom: 25px;
    }

    .stamp h2 {
      color: #c9a7ff;
      margin-top: 0;
    }

    .message {
      font-size: 18px;
      margin: 20px 0;
    }

    button {
      border: none;
      border-radius: 30px;
      padding: 14px 28px;
      font-size: 16px;
      background: #6d4aff;
      color: white;
      cursor: pointer;
    }

    button:disabled {
      background: #555;
      cursor: default;
    }

    .status {
      margin-top: 30px;
      padding: 15px;
      border-radius: 12px;
      background: #222;
      font-size: 14px;
    }
    
/* 7紋コンプリート演出 */
.complete-message {
  margin-top: 24px;
  padding: 20px 12px;
  text-align: center;
  color: #f5df9b;
  border: 1px solid #b99a55;
  border-radius: 12px;
  background: rgba(35, 24, 55, 0.88);
  opacity: 0;
  transform: translateX(-20px);
}

.complete-show {
  animation: completeReveal 1.8s ease-out forwards;
}

.complete-message h2 {
  font-size: 1.25rem;
  margin: 0 0 12px;
}

.complete-message p {
  margin: 0;
  line-height: 1.7;
}

@keyframes completeReveal {
  from {
    opacity: 0;
    transform: translateX(-20px);
    clip-path: inset(0 100% 0 0);
  }
  to {
    opacity: 1;
    transform: translateX(0);
    clip-path: inset(0 0 0 0);
  }
}

  </style>
</head>

<body>

  <div class="container">

    <h1>STORY of FANTASY GUILD</h1>

    <div class="subtitle">
      7つの世界から魔法のアイテムを探せ
    </div>

    <div id="stamp" class="stamp">
      <h2>🔮 錬成の属性紋</h2>

      <div class="message">
        ALCHEMIST<br>
        属性紋を発見した！
      </div>
    
<img
  src="https://drive.google.com/thumbnail?id=1C-R3qs-gomvKSlZ73_6umvbBhWyO-UgV&sz=w1000"
  alt="錬成の属性紋 ALCHEMIST"
  style="width:100%; max-width:320px; height:auto; display:block; margin:20px auto; border-radius:12px;"
>
      <button id="getButton" onclick="getStamp()">
        属性紋を獲得する
      </button>
    </div>

    <div id="noStamp">
      このページはスタンプラリーの入口です
    </div>

    
<div class="status">
  <div>獲得した属性紋</div>
  <div id="count">0 / 9</div>
</div>

<div id="completeMessage" class="complete-message" style="display: none;">
  <h2>✦ 7つの属性紋、コンプリート！ ✦</h2>
  <p>すべての属性紋が冒険者の手に集まった……</p>
</div>

  </div>

  <script>
    // 7属性紋の情報
    const attributes = {
      alchemist: {
        name: "錬成",
        emoji: "🔮",
        english: "ALCHEMIST",
        image: "https://drive.google.com/thumbnail?id=1C-R3qs-gomvKSlZ73_6umvbBhWyO-UgV&sz=w1000"
      },
      gemmaster: {
        name: "装飾",
        emoji: "💎",
        english: "GEM MASTER",
        image: "https://drive.google.com/thumbnail?id=1tJe2ZaTdOLEJR7vPBUGit5UDd-jcD3lq&sz=w1000"
      },
      blacksmith: {
        name: "鍛造",
        emoji: "🔨",
        english: "BLACKSMITH",
        image: "https://drive.google.com/thumbnail?id=1FFttmEON8KDu07-kyd8RIdgG3q7QXnKb&sz=w1000"
      },
      tailor: {
        name: "縫製",
        emoji: "🧵",
        english: "TAILOR",
        image: "https://drive.google.com/thumbnail?id=1KhXRAopdqKdq0tNaBaFRMZ0Sw7WijOCA&sz=w1000"
      },
      scribe: {
        name: "紙工",
        emoji: "📜",
        english: "SCRIBE",
        image: "https://drive.google.com/thumbnail?id=1bqNbkgMYRM2zwmRWg_YUYYMtpcr7_ng8&sz=w1000"
      },
      woodsmith: {
        name: "樹工",
        emoji: "🌳",
        english: "WOODSMITH",
        image: "https://drive.google.com/thumbnail?id=1PvfZ_aRvgcVa-8UVKTv4iKC0T_B3CoMv&sz=w1000"
      },
      herbalist: {
        name: "香食",
        emoji: "🌿",
        english: "HERBALIST",
        image: "https://drive.google.com/thumbnail?id=1iNg8QRQMvhhqeC93FV2J8oFF3k69Z3OW&sz=w1000"
      },
      stamp8: {
        name: "ハロウィン",
        emoji: "🎃",
        english: "HALLOWEEN",
        image: "https://drive.google.com/thumbnail?id=1rh_W79j4HtyCcBz-ecU8ZHdSpn1eZrCq&sz=w1000"
      },
      stamp9: {
        name: "終幕",
        emoji: "🌙",
        english: "FINAL CHAPTER",
        image: "https://drive.google.com/thumbnail?id=1Av7nO6GJ8owAdMgaUgcYXbTNnLrEi93a&sz=w1000"
      }
    };

    // 保存済みの属性紋を読み込む
    let stamps = JSON.parse(
      localStorage.getItem("fantasyGuildStamps") || "[]"
    );

    // URLから今回の属性紋を取得
    const params = new URLSearchParams(window.location.search);
    const stamp = params.get("stamp");
    const current = attributes[stamp];

    // 対応するQRコードから来た場合だけ表示
    if (current) {
      document.getElementById("stamp").style.display = "block";
      document.getElementById("noStamp").style.display = "none";

      document.querySelector("#stamp h2").textContent =
        current.emoji + " " + current.name + "の属性紋";

            const messageText = {
        stamp8: "第8紋を発見した！",
        stamp9: "第9紋を発見した！"
      };

      document.querySelector("#stamp .message").innerHTML =
        current.english + "<br>" +
        (messageText[stamp] || "属性紋を発見した！");

      const image = document.querySelector("#stamp img");
      image.src = current.image;
      image.alt = current.name + "の属性紋 " + current.english;

      if (stamps.includes(stamp)) {
        document.getElementById("getButton").disabled = true;
        document.getElementById("getButton").textContent = "獲得済み";
      }
    }

    // 属性紋を獲得する
    function getStamp() {
      if (!current) return;

      if (!stamps.includes(stamp)) {
        stamps.push(stamp);
        localStorage.setItem(
          "fantasyGuildStamps",
          JSON.stringify(stamps)
        );
      }

      document.getElementById("getButton").disabled = true;
      document.getElementById("getButton").textContent = "獲得済み";

      updateCount();
      alert(current.emoji + " " + current.name + "の属性紋を獲得しました！");
    }

   // 獲得数を表示
function updateCount() {
  document.getElementById("count").textContent =
    stamps.length + " / 9";

  // 7つの属性紋を集めたらコンプリート演出
  const attributeKeys = [
    "alchemist",
    "gemmaster",
    "blacksmith",
    "tailor",
    "scribe",
    "woodsmith",
    "herbalist"
  ];

  const attributeCount = attributeKeys.filter(
    key => stamps.includes(key)
  ).length;

  if (attributeCount >= 7) {
    const message = document.getElementById("completeMessage");
    message.style.display = "block";
    message.classList.add("complete-show");
  }
}

    updateCount(); 
  </script>

</body>
</html>

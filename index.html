<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STORY of FANTASY GUILD</title>

  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #111;
      color: #fff;
      font-family: sans-serif;
      text-align: center;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 14px;
      color: #ccc;
      margin-bottom: 30px;
    }

    .stamp {
      display: none;
      padding: 25px;
      border: 2px solid #b58cff;
      border-radius: 20px;
      background: #1c1628;
      margin-bottom: 25px;
    }

    .stamp h2 {
      color: #c9a7ff;
      margin-top: 0;
    }

    .message {
      font-size: 18px;
      margin: 20px 0;
    }

    button {
      border: none;
      border-radius: 30px;
      padding: 14px 28px;
      font-size: 16px;
      background: #6d4aff;
      color: white;
      cursor: pointer;
    }

    button:disabled {
      background: #555;
      cursor: default;
    }

    .status {
      margin-top: 30px;
      padding: 15px;
      border-radius: 12px;
      background: #222;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>STORY of FANTASY GUILD</h1>

    <div class="subtitle">
      7つの世界から魔法のアイテムを探せ
    </div>

    <div id="stamp" class="stamp">
      <h2>🔮 錬成の属性紋</h2>

      <div class="message">
        ALCHEMIST<br>
        属性紋を発見した！
      </div>
<img
src="https://drive.google.com/thumbnail?id=1C-R3qs-gomvKSlZ73_6umvbBhWyO-UgV&sz=w1000"錬成の属性紋 ALCHEMIST"
style="width:100%; max-width:320px; height:auto; display:block; margin:20px auto; border-radius:12px;"
>
      <button id="getButton" onclick="getStamp()">
        属性紋を獲得する
      </button>
    </div>

    <div id="noStamp">
      このページはスタンプラリーの入口です。
    </div>

    <div class="status">
      <div>獲得した属性紋</div>
      <div id="count">0 / 7</div>
    </div>

  </div>

  <script>
    // 7属性紋の情報
    const attributes = {
      alchemist: {
        name: "錬成",
        emoji: "🔮",
        english: "ALCHEMIST",
        image: "https://drive.google.com/thumbnail?id=1C-R3qs-gomvKSlZ73_6umvbBhWyO-UgV&sz=w1000"
      },
      gemmaster: {
        name: "装飾",
        emoji: "💎",
        english: "GEM MASTER",
        image: "https://drive.google.com/thumbnail?id=1tJe2ZaTdOLEJR7vPBUGit5UDd-jcD3lq&sz=w1000"
      },
      blacksmith: {
        name: "鍛造",
        emoji: "🔨",
        english: "BLACKSMITH",
        image: "https://drive.google.com/thumbnail?id=1FFttmEON8KDu07-kyd8RIdgG3q7QXnKb&sz=w1000"
      },
      tailor: {
        name: "縫製",
        emoji: "🧵",
        english: "TAILOR",
        image: "https://drive.google.com/thumbnail?id=1KhXRAopdqKdq0tNaBaFRMZ0Sw7WijOCA&sz=w1000"
      },
      scribe: {
        name: "紙工",
        emoji: "📜",
        english: "SCRIBE",
        image: "https://drive.google.com/thumbnail?id=1bqNbkgMYRM2zwmRWg_YUYYMtpcr7_ng8&sz=w1000"
      },
      woodsmith: {
        name: "樹工",
        emoji: "🌳",
        english: "WOODSMITH",
        image: "https://drive.google.com/thumbnail?id=1PvfZ_aRvgcVa-8UVKTv4iKC0T_B3CoMv&sz=w1000"
      },
      herbalist: {
        name: "香食",
        emoji: "🌿",
        english: "HERBALIST",
        image: "https://drive.google.com/thumbnail?id=1IfyROPcbEedakOompVGYRpVkK4xqsu2y&sz=w1000"
      }
    };

    // 保存済みの属性紋を読み込む
    let stamps = JSON.parse(
      localStorage.getItem("fantasyGuildStamps") || "[]"
    );

    // URLから今回の属性紋を取得
    const params = new URLSearchParams(window.location.search);
    const stamp = params.get("stamp");
    const current = attributes[stamp];

    // 対応するQRコードから来た場合だけ表示
    if (current) {
      document.getElementById("stamp").style.display = "block";
      document.getElementById("noStamp").style.display = "none";

      document.querySelector("#stamp h2").textContent =
        current.emoji + " " + current.name + "の属性紋";

      document.querySelector("#stamp .message").innerHTML =
        current.english + "<br>属性紋を発見した！";

      const image = document.querySelector("#stamp img");
      image.src = current.image;
      image.alt = current.name + "の属性紋 " + current.english;

      if (stamps.includes(stamp)) {
        document.getElementById("getButton").disabled = true;
        document.getElementById("getButton").textContent = "獲得済み";
      }
    }

    // 属性紋を獲得する
    function getStamp() {
      if (!current) return;

      if (!stamps.includes(stamp)) {
        stamps.push(stamp);
        localStorage.setItem(
          "fantasyGuildStamps",
          JSON.stringify(stamps)
        );
      }

      document.getElementById("getButton").disabled = true;
      document.getElementById("getButton").textContent = "獲得済み";

      updateCount();
      alert(current.emoji + " " + current.name + "の属性紋を獲得しました！");
    }

    // 獲得数を表示
    function updateCount() {
      document.getElementById("count").textContent =
        stamps.length + " / 7";
    }

    updateCount();  </script>

</body>
</html>
